name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run fast unit tests
        run: python -m pytest -q -m unit

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql+psycopg://salon:salon@localhost:5432/salon_test
      TEST_DATABASE_URL: postgresql+psycopg://salon:salon@localhost:5432/salon_test

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: salon_test
          POSTGRES_USER: salon
          POSTGRES_PASSWORD: salon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salon -d salon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Apply and check migrations
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: Run integration tests on PostgreSQL
        run: python -m pytest -q -m integration
